# /etc/nginx/conf.d/guessgame.conf — public entry point on VM3 (port 80).
# The `guessgame` upstream (which app container is live) is defined in
# guessgame-upstream.conf, which the deploy script rewrites on every blue/green switch.

limit_req_zone $binary_remote_addr zone=stress:1m rate=2r/m;   # /stress is expensive

server {
    listen 80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;

    location / {
        proxy_pass http://guessgame;
    }

    # Prometheus (in Docker on this host) scrapes the live colour here. Not public.
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://guessgame;
    }

    location = /stress {
        limit_req zone=stress burst=2 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;
        proxy_pass http://guessgame;
    }

    # Grafana on port 80 as well as 3030, because many networks block unusual ports.
    location /grafana/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3030;
    }
    location /grafana/api/live/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3030;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }
}
