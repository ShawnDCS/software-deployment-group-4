# /etc/nginx/conf.d/guessgame.conf

limit_req_zone $binary_remote_addr zone=stress:1m rate=2r/m;
server_names_hash_bucket_size 128;

server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge files (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/guessgame-locations.conf;
}
