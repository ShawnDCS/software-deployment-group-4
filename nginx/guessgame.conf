# /etc/nginx/conf.d/guessgame.conf — plain-HTTP default server on VM3 (port 80).
# Serves requests by IP / localhost / host.docker.internal: the deploy scripts' checks and
# Prometheus use this. Browsers using the public name are redirected to HTTPS by
# guessgame-https.conf once the certificate exists.

limit_req_zone $binary_remote_addr zone=stress:1m rate=2r/m;   # /stress is expensive
server_names_hash_bucket_size 128;   # our public name is 49 chars; default bucket (64) is too small

server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge files (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/guessgame-locations.conf;
}
