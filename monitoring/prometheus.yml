# Prometheus scrape configuration (VM3)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance: vm3-prod }

  # Per-container CPU / memory (shows the blue and green app containers separately)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { instance: vm3-prod }

  # The game's own /metrics, scraped THROUGH Nginx so it always hits the live colour
  - job_name: guessgame
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:80"]
        labels: { instance: vm3-prod, service: guessgame }
